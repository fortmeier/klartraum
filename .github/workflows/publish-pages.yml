# Publishes the main site and develop documentation together as one Pages site.
name: Publish documentation

on:
  workflow_run:
    workflows: [Site and documentation]
    branches: [main, develop]
    types: [completed]
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/pages.yml
      - .github/workflows/publish-pages.yml
      - scripts/site/**

permissions:
  contents: read

# Serialize the complete publication so each queued run builds current branch tips.
concurrency:
  group: publish-pages-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          path: main
          lfs: true
          persist-credentials: false

      - name: Check out develop
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: develop
          path: develop
          lfs: true
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            main/docs/requirements.txt
            develop/docs/requirements.txt

      - name: Install Doxygen
        run: sudo apt-get update && sudo apt-get install -y doxygen

      - name: Install documentation dependencies
        run: |
          python -m venv "$RUNNER_TEMP/docs-main"
          "$RUNNER_TEMP/docs-main/bin/pip" install -r main/docs/requirements.txt
          python -m venv "$RUNNER_TEMP/docs-develop"
          "$RUNNER_TEMP/docs-develop/bin/pip" install -r develop/docs/requirements.txt

      - name: Build main site
        working-directory: main
        run: SPHINX_BUILD="$RUNNER_TEMP/docs-main/bin/sphinx-build" ./scripts/site/build_site.sh

      - name: Build develop documentation
        run: |
          "$RUNNER_TEMP/docs-develop/bin/sphinx-build" -W --keep-going -q \
            -D 'html_title=Klartraum Engine (develop)' develop/docs main/_site/develop/docs

      - name: Check documentation paths
        run: |
          test -s main/_site/docs/index.html
          test -s main/_site/docs/searchindex.js
          test -s main/_site/develop/docs/index.html
          test -s main/_site/develop/docs/searchindex.js

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: main/scripts/site/package-lock.json

      - name: Check landing page
        working-directory: main/scripts/site
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run check

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: published-site-screenshots
          path: main/build/TestingOutput/site-*.png
          if-no-files-found: ignore

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: main/_site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
