# Checks that run on every commit. Enable them once per clone with
#   uv tool install pre-commit
#   pre-commit install
# and run them on the whole repository with
#   pre-commit run --all-files
# See docs/contributing/development.md.

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # Files tracked by Git LFS are skipped; anything else above 1 MiB
      # (e.g. model weights) has to go through LFS or stay out of the repo.
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: check-merge-conflict
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: trailing-whitespace
        exclude: ^LICENSES/
      - id: end-of-file-fixer
        exclude: ^LICENSES/

  - repo: https://github.com/fsfe/reuse-tool
    rev: v6.2.0
    hooks:
      # Every committed file needs copyright and license information: an SPDX
      # header for source files (scripts/dev/reuse_annotate.sh adds it), an
      # entry in REUSE.toml for everything else.
      - id: reuse-lint-file

  - repo: local
    hooks:
      # Headers need an include guard named after their path; run
      # `python3 scripts/dev/include_guards.py --fix` to add or rename it.
      - id: include-guards
        name: include guards
        entry: python scripts/dev/include_guards.py
        language: python
        files: \.hpp$
      # examples/README.md (also shown in the docs) has a section for every
      # example and names only options that the example parses.
      - id: example-docs
        name: example docs
        entry: python scripts/dev/check_examples.py
        language: python
        files: ^examples/
        pass_filenames: false

  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v23.1.2
    hooks:
      # Formats staged C++ files with .clang-format. Shaders are not formatted.
      - id: clang-format
        types_or: [c++]
        files: \.(cpp|hpp)$
