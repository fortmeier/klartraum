[project]
name = "klartraum-character-animation"
version = "0.1.0"
description = "Training and export of Klartraum's mixture-of-experts character controller"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy==2.2.6",
    "onnx==1.18.0",
    "onnxruntime==1.22.0",
    "torch==2.7.1",
]

[tool.uv]
package = false

# CUDA builds on Windows and Linux; macOS uses the regular PyPI builds.
[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform != 'darwin'" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
