[project]
name = "klartraum-sd15-onnx"
version = "0.1.0"
description = "Stable Diffusion 1.5 VAE reference and ONNX export experiment for Klartraum"
requires-python = ">=3.12,<3.13"
dependencies = [
    "diffusers==0.35.1",
    "huggingface-hub==0.34.4",
    "numpy==2.2.6",
    "onnx==1.18.0",
    "onnxsim==0.4.36",
    "onnxruntime-gpu==1.22.0",
    "pillow==11.3.0",
    "safetensors==0.6.2",
    "torch==2.7.1",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
