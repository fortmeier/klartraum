[project]
name = "klartraum-onnx-tools"
version = "0.1.0"
description = "Reproducible ONNX fixture generation for Klartraum"
requires-python = ">=3.12,<3.13"
dependencies = [
    "ipykernel==6.29.5",
    "jupyterlab==4.4.4",
    "nbconvert==7.16.6",
    "onnx==1.18.0",
    "onnxruntime==1.22.0",
    "torch==2.7.1",
    "torchvision==0.22.1",
    "tqdm==4.67.1",
]

[tool.uv]
package = false

# CUDA builds on Windows and Linux; macOS uses the regular PyPI builds.
[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform != 'darwin'" }]
torchvision = [{ index = "pytorch-cu128", marker = "sys_platform != 'darwin'" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
