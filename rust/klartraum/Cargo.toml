[package]
name = "klartraum"
version = "0.1.0"
description = "Rust port of the Klartraum Vulkan compute/rendering engine"
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
anyhow = "1"
ash = "0.38"
ash-window = "0.13"
bytemuck = { version = "1", features = ["derive", "extern_crate_alloc"] }
flate2 = "1"
raw-window-handle = "0.6"
ruzstd = "0.8"
